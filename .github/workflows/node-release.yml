name: Publish Node.js binding

on:
  push:
    tags:
      - 'node-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Node binding tag to publish or recover
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: node-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-node:
    name: Publish four coordinated npm packages
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out the binding tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify independent versions and native release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^node-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$release_sha"

          package_version="$(node -p \
            'require("./bindings/js/node/package.json").version')"
          declared_version="$(node --input-type=module -e '
            import { MORPHEUS_NODE_VERSION } from "./bindings/js/node/internal/version.js";
            console.log(MORPHEUS_NODE_VERSION);
          ')"
          native_metadata="$(node --input-type=module -e '
            import {
              MORPHEUS_NATIVE_ABI_VERSION,
              MORPHEUS_NATIVE_VERSION,
            } from "./bindings/js/node/internal/native-manifest.js";
            console.log(`${MORPHEUS_NATIVE_VERSION} ${MORPHEUS_NATIVE_ABI_VERSION}`);
          ')"
          read -r native_version native_abi <<<"$native_metadata"
          test "$package_version" = "$declared_version"
          test "$RELEASE_TAG" = "node-v$package_version"

          for target in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
            platform_version="$(node -p \
              "require('./bindings/js/node/npm/$target/package.json').version")"
            test "$platform_version" = "$package_version"
          done

          release_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/v$native_version")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.published_at' <<<"$release_json")" != null

          npm_version="$(npm --version)"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            if (major < 11 || (major === 11 && (minor < 5 || (minor === 5 && patch < 1)))) process.exit(1);
          ' "$npm_version"

          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Wait for tagged qualification
        id: qualification
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.metadata.outputs.release-sha }}
        with:
          script: |
            const required = [
              { workflow: 'test.yml', label: 'Linux CI' },
              { workflow: 'platform.yml', label: 'platform qualification' },
            ]
            const deadline = Date.now() + 15 * 60 * 1000
            while (Date.now() < deadline) {
              let pending = false
              for (const item of required) {
                const result = await github.rest.actions.listWorkflowRuns({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  workflow_id: item.workflow,
                  event: 'push',
                  head_sha: process.env.RELEASE_SHA,
                  per_page: 10,
                })
                const run = result.data.workflow_runs.find((candidate) =>
                  candidate.head_sha === process.env.RELEASE_SHA
                )
                if (run?.status !== 'completed') {
                  pending = true
                  core.info(run === undefined
                    ? `Waiting for ${item.label} to appear.`
                    : `Waiting for ${item.label} ${run.html_url}: ${run.status}.`)
                  continue
                }
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `${item.label} ${run.html_url} concluded ${run.conclusion}`,
                  )
                }
                core.info(`${item.label} passed: ${run.html_url}`)
                if (item.workflow === 'platform.yml') {
                  core.setOutput('platform-run-id', String(run.id))
                }
              }
              if (!pending) return
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
            throw new Error('Timed out waiting for tagged qualification')

      - name: Download qualified Node.js packages
        uses: actions/download-artifact@v5
        with:
          pattern: libmorpheus-node-*
          path: ${{ runner.temp }}/node-platforms
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.qualification.outputs.platform-run-id }}

      - name: Verify publication set
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          PLATFORM_ROOT: ${{ runner.temp }}/node-platforms
        run: |
          expected="$(printf '%s\n' \
            libmorpheus-node-darwin-arm64 \
            libmorpheus-node-linux-arm64-gnu \
            libmorpheus-node-linux-x64-gnu | sort)"
          actual="$(find "$PLATFORM_ROOT" -mindepth 1 -maxdepth 1 \
            -type d -printf '%f\n' | sort)"
          test "$actual" = "$expected"
          for target in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
            directory="$PLATFORM_ROOT/libmorpheus-node-$target"
            test -f "$directory/libmorpheus_node.node"
            test "$(node -p \
              "require('$directory/package.json').name")" = \
              "@libmorpheus/node-$target"
            test "$(node -p \
              "require('$directory/package.json').version")" = \
              "$PACKAGE_VERSION"
            npm pack --dry-run --ignore-scripts "$directory"
          done
          npm pack --dry-run --ignore-scripts ./bindings/js/node

      - name: Test installation from release tarballs
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          PLATFORM_ROOT: ${{ runner.temp }}/node-platforms
        run: |
          pack_root="$RUNNER_TEMP/node-packs"
          consumer_root="$RUNNER_TEMP/node-consumer"
          mkdir -p "$pack_root" "$consumer_root"
          platform_tarball="$(npm pack --silent --ignore-scripts \
            --pack-destination "$pack_root" \
            "$PLATFORM_ROOT/libmorpheus-node-linux-x64-gnu")"
          main_tarball="$(npm pack --silent --ignore-scripts \
            --pack-destination "$pack_root" ./bindings/js/node)"
          cd "$consumer_root"
          npm init --yes
          npm install --ignore-scripts \
            "$pack_root/$platform_tarball" "$pack_root/$main_tarball"
          node -e '
            const resolved = require.resolve("@libmorpheus/node-linux-x64-gnu");
            if (!resolved.endsWith("libmorpheus_node.node")) process.exit(1);
          '
          node --input-type=module -e '
            const binding = await import("@libmorpheus/node");
            if (binding.MORPHEUS_NODE_VERSION !== process.env.PACKAGE_VERSION) {
              process.exit(1);
            }
          '
          setup_help="$(./node_modules/.bin/libmorpheus-setup --help)"
          grep -F 'Usage: libmorpheus-setup' <<<"$setup_help"

      - name: Publish platform packages, then main package
        env:
          PACKAGE_VERSION: ${{ steps.metadata.outputs.package-version }}
          PLATFORM_ROOT: ${{ runner.temp }}/node-platforms
        run: |
          publish_if_missing() {
            package="$1"
            directory="$2"
            published="$(npm view "$package@$PACKAGE_VERSION" version \
              2>/dev/null || true)"
            if test -n "$published"; then
              test "$published" = "$PACKAGE_VERSION"
              echo "$package@$PACKAGE_VERSION is already published."
            else
              npm publish "$directory" --access public --provenance
            fi
          }

          for target in darwin-arm64 linux-arm64-gnu linux-x64-gnu; do
            publish_if_missing \
              "@libmorpheus/node-$target" \
              "$PLATFORM_ROOT/libmorpheus-node-$target"
          done
          publish_if_missing \
            "@libmorpheus/node" \
            ./bindings/js/node

  github-release:
    name: Publish the GitHub release from the npm registry files
    needs: publish-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Check out the binding tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stage the published files, verified against the registry
        run: |
          python3 -I tools/registry-release-assets.py npm \
            "${RELEASE_TAG#node-v}" "$RUNNER_TEMP/release-assets"

      - name: Create or complete the release
        uses: actions/github-script@v8
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/release-assets
        with:
          script: |
            const publish = require('./.github/scripts/binding-release.cjs')
            const { execSync } = require('child_process')
            const tag = process.env.RELEASE_TAG
            const sha = execSync('git rev-parse HEAD').toString().trim()
            await publish({ github, context, core, tag, sha, assetDirectory: process.env.ASSET_DIRECTORY })
