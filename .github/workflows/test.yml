name: Linux CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
      - "node-v*"
      - "python-v*"
      - "wasm-v*"
      - "data-v*"
  pull_request:
    # Lexical research files (the Latin and Greek Python tools and their
    # tests, the research workflows, their reference receipts and the
    # documentation) do not touch the runtime contract this workflow
    # qualifies. The research importers that carry no language in their
    # name are listed one by one, so that the production Python files stay
    # covered: tools/build-stemlib-lexical.py (the stemlib builder CMake
    # runs), tools/audit-stemlib-lexical.py, tools/package-stemlib-runtime.py,
    # tools/assemble-stemlib-qualification.py (used below) and the CMake
    # tests test/stemlib-*.py.
    paths-ignore:
      - 'docs/**'
      - 'tools/*-latin-*.py'
      - 'tools/*-greek-*.py'
      - 'tools/audit-lexical-stems.py'
      - 'tools/partition-lexical-latin.py'
      - 'tools/prepare-greek-lexical-review.py'
      - 'tools/reconstruct-lexical-exports.py'
      - 'tools/split-greek-lexical-headers.py'
      - 'tools/transfer-lexical-record-corrections.py'
      - 'tools/latin-*.json'
      - 'tools/latin-*.json.license'
      - 'test/*-latin-*.py'
      - 'test/*-greek-*.py'
      - 'test/audit-lexical-stems.py'
      - 'test/partition-lexical-latin.py'
      - 'test/prepare-greek-lexical-review.py'
      - 'test/reconstruct-lexical-exports.py'
      - 'test/split-greek-lexical-headers.py'
      - 'test/transfer-lexical-record-corrections.py'
      - '.github/workflows/latin-*.yml'
      - '.github/workflows/lexical-import-research.yml'
      - '.github/workflows/documentation-license.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! startsWith(github.ref, 'refs/tags/') }}

jobs:
  cmake:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure
        env:
          CC: gcc-14
        run: >-
          cmake --preset dev
          -DMORPHEUS_BUILD_STEMLIB_TOOLS=ON
          -DMORPHEUS_STEMLIB_QUALIFICATION_PROFILE=github-ubuntu-24.04-gcc-14-python-3.12

      - name: Build
        run: cmake --build --preset dev

      - name: Build qualified stemlib distributions and internal runtime artifacts
        run: |
          cmake_bin="$(command -v cmake)"
          env PATH= "$cmake_bin" --build --preset dev --target morpheus_stemlib_runtime_artifacts
          test -f build/dev/stemlib-production/greek/MORPHEUS-STEMLIB-PRODUCTION-RECEIPT.json
          test -f build/dev/stemlib-production/latin/MORPHEUS-STEMLIB-PRODUCTION-RECEIPT.json
          for language in greek latin; do
            archive="build/dev/stemlib-runtime-artifacts/morpheus-stemlib-$language.tar.gz"
            test -f "$archive"
            test -f "$archive.sha256"
            test -f "$archive.receipt.json"
          done
          cmake \
            -DMORPHEUS_GREEK_ARCHIVE="$PWD/build/dev/stemlib-runtime-artifacts/morpheus-stemlib-greek.tar.gz" \
            -DMORPHEUS_LATIN_ARCHIVE="$PWD/build/dev/stemlib-runtime-artifacts/morpheus-stemlib-latin.tar.gz" \
            -DMORPHEUS_CRUNCHER="$PWD/build/dev/cruncher" \
            -DMORPHEUS_FIXTURES="$PWD/test/fixture.json" \
            -DMORPHEUS_FIXTURE_RUNNER="$PWD/test/test-fixtures.cmake" \
            -DMORPHEUS_WORK_DIR="$PWD/build/dev/stemlib-runtime-smoke" \
            -P test/stemlib-runtime-artifacts.cmake
          cmake -E sha256sum \
            build/dev/stemlib-production/greek/MORPHEUS-STEMLIB-PRODUCTION-RECEIPT.json \
            build/dev/stemlib-production/latin/MORPHEUS-STEMLIB-PRODUCTION-RECEIPT.json \
            > build/dev/stemlib-production-receipts.sha256
          cmake -E cat build/dev/stemlib-production-receipts.sha256

      - name: Test
        run: |
          ctest --preset dev --output-junit "$PWD/build/dev/ctest.xml"
          cmake -E cat build/dev/test-stemlib-table-build/baseline-summary.tsv
          cmake -E cat build/dev/test-stemlib-table-build/baseline-differences.tsv
          cmake -E cat build/dev/test-stemlib-table-build/binary-semantic-comparison.tsv
          cmake -E cat build/dev/test-stemlib-lexical-build/alpheios-reference-comparison.tsv

      - name: Assemble stemlib qualification evidence
        run: |
          python3 tools/assemble-stemlib-qualification.py \
            --source . --build build/dev \
            --ctest-junit build/dev/ctest.xml \
            --output build/dev/stemlib-qualification.json
          cmake -E cat build/dev/stemlib-qualification.json

      - name: Preserve stemlib qualification evidence
        uses: actions/upload-artifact@v4
        with:
          name: stemlib-qualification-${{ github.sha }}
          retention-days: 30
          if-no-files-found: error
          path: |
            build/dev/stemlib-qualification.json
            build/dev/ctest.xml
            build/dev/stemlib-production-receipts.sha256
            build/dev/stemlib-production/*/MORPHEUS-STEMLIB-PRODUCTION-RECEIPT.json
            build/dev/stemlib-production/*/MORPHEUS-STEMLIB-LEXICAL-COMPARISON.tsv
            build/dev/stemlib-production/*/MORPHEUS-STEMLIB-TABLE-PROVENANCE.tsv
            build/dev/stemlib-production/*/*/lexical/provenance.json
            build/dev/stemlib-runtime-artifacts/*.receipt.json
            build/dev/stemlib-runtime-artifacts/*.sha256
            build/dev/stemlib-runtime-smoke/MORPHEUS-STEMLIB-RUNTIME-SMOKE.json
            build/dev/test-stemlib-table-build/baseline-summary.tsv
            build/dev/test-stemlib-table-build/baseline-differences.tsv
            build/dev/test-stemlib-table-build/binary-semantic-comparison.tsv
            build/dev/test-stemlib-lexical-build/alpheios-reference-comparison.tsv

      - name: Test runtime-data preparation helper
        env:
          MORPHEUS_RUNTIME_DATA_BUILD_DIR: build/dev
        run: |
          sh tools/prepare-runtime-data.sh build/runtime-data-test
          test -d build/runtime-data-test/Greek
          test -f build/runtime-data-test/MORPHEUS-DATA.txt
          cmake -E sha256sum build/runtime-data-test/gener.index | \
            grep -F '5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6'

  release:
    if: >-
      github.event_name == 'push' &&
      !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure optimized release
        run: cmake --preset release -DBUILD_TESTING=ON

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test optimized release and installed surface
        run: ctest --preset release

  sanitizers:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure sanitizers
        run: cmake --preset sanitizers

      - name: Build sanitizers
        run: cmake --build --preset sanitizers

      - name: Test sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:strict_string_checks=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --preset sanitizers

  thread-sanitizer:
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Configure ThreadSanitizer
        run: cmake --preset thread-sanitizer

      - name: Build ThreadSanitizer
        run: cmake --build --preset thread-sanitizer

      - name: Test ThreadSanitizer
        run: ctest --preset thread-sanitizer

  gener-preparer:
    runs-on: ubuntu-latest
    container: emscripten/emsdk:4.0.15
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install supported CMake
        run: |
          python3 -m pip install --user cmake==3.31.6
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure WebAssembly preparer
        run: >-
          emcmake cmake -S . -B build/gener-wasm
          -DBUILD_TESTING=OFF
          -DMORPHEUS_BUILD_JS_GENER_PREPARER=ON

      - name: Build WebAssembly preparer
        run: >-
          cmake --build build/gener-wasm
          --target morpheus_gener_source_preparer

      - name: Upload WebAssembly preparer
        uses: actions/upload-artifact@v4
        with:
          name: gener-preparer
          path: build/gener-wasm/gener_preparer.mjs
          if-no-files-found: error

      - name: Verify the checked-in WebAssembly preparer
        run: |
          cmp build/gener-wasm/gener_preparer.mjs \
            bindings/js/data/internal/gener-preparer.mjs

  node:
    name: Node.js binding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Locate Node-API headers
        id: node
        run: |
          node_prefix="$(node -p \
            "require('node:path').resolve(process.execPath, '../..')")"
          test -f "$node_prefix/include/node/node_api.h"
          echo "include=$node_prefix/include/node" >> "$GITHUB_OUTPUT"

      - name: Configure native runtime and Node-API addon
        run: >-
          cmake --preset dev
          -DMORPHEUS_BUILD_NODE_BINDING=ON
          -DMORPHEUS_NODE_INCLUDE_DIR=${{ steps.node.outputs.include }}

      - name: Build native runtime, Node-API addon and benchmark inputs
        run: >-
          cmake --build --preset dev --target
          morpheus libmorpheus_node cruncher morpheus_gener_index_builder
          morpheus_gener_source_preparer morpheus_gener_index_reader_test

      - name: Prepare experimental generation fixture
        run: >-
          build/dev/morpheus_gener_index_builder
          stemlib/gener.index
          test/generation-service-source.txt

      - name: Link the in-tree data package into the Node.js binding
        # The binding depends on @libmorpheus/data; the tree's own copy is
        # linked (not the registry's) so that both packages are tested
        # together. --no-save leaves package.json untouched.
        working-directory: bindings/js/node
        run: npm install --ignore-scripts --no-save --no-package-lock ../data

      - name: Test Node.js binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/dev/libmorpheus.so
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/dev/node/libmorpheus_node.node
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        working-directory: bindings/js/node
        run: npm test

      - name: Test the benchmark harness
        run: |
          sh -n bench/release.sh
          node --test bench/test/*.test.mjs

      - name: Validate accepted release benchmark evidence
        # The schema 2 reports of the retired Deno harness stay readable by
        # the validator; release_metadata checks every retained sidecar.
        run: |
          node bench/validate.mjs \
            bench/release-evidence/benchmark-0.4.5.json \
            --label release-candidate \
            --revision 5ba9dc037510f51dc8c13440a8d61a76f6d04739 \
            --stemlib-revision 4632415fe93c85e9fdca47a0c5a13f31385f0023 \
            --compiler 'Apple clang version 21.0.0 (clang-2100.4.1.1)'

      - name: Smoke-test benchmark runner
        # One iteration of every native model against the retained schema 3
        # baseline: every measured row must find its counterpart.
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/dev/libmorpheus.so
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/dev/node/libmorpheus_node.node
          MORPHEUS_CRUNCHER: ${{ github.workspace }}/build/dev/cruncher
        run: |
          ctest --test-dir build/dev --output-on-failure -R '^gener_corpus$'
          mkdir -p build/benchmark-stemlib
          ln -s "$PWD/stemlib/Greek" build/benchmark-stemlib/Greek
          cp build/dev/test-gener-corpus/first.mgi build/benchmark-stemlib/gener.index
          MORPHEUS_STEMLIB="$PWD/build/benchmark-stemlib" \
            node bench/compare.mjs --iterations 1 --warmup 0 --contexts 1 \
            --cold-samples 1 --generation-small 'lo/gos' \
            --generation-maximal 'i(/hmi' --json \
            --baseline bench/release-evidence/benchmark-0.4.5-node-packed.json \
            > build/benchmark-smoke.json
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync("build/benchmark-smoke.json", "utf8"));
            if (report.schemaVersion !== 3 || report.comparisonScope !== "complete") throw new Error(JSON.stringify(report));
            if (report.comparison.length !== report.measurements.length) throw new Error(JSON.stringify(report.comparison));
          '

      - name: Acquire pinned native runtime with Node.js
        working-directory: bindings/js/node
        run: |
          node native.js --output ../../../build/node-native-acquired
          test -f ../../../build/node-native-acquired/MORPHEUS-NATIVE.json
          test -f ../../../build/node-native-acquired/lib/libmorpheus.so

      - name: Acquire and verify pinned Node.js dataset
        working-directory: bindings/js/node
        run: |
          node data.js --dataset perseids \
            --output ../../../build/node-data-acquired
          test -f ../../../build/node-data-acquired/MORPHEUS-DATA.json
          test -f ../../../build/node-data-acquired/Latin/steminds/nomind
          node data.js --dataset alpheios --with-gener \
            --output ../../../build/node-data-gener-acquired
          cmake -E sha256sum \
            ../../../build/node-data-gener-acquired/gener.index | \
            grep -F '5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6'

      - name: Test the data acquisition package
        working-directory: bindings/js/data
        run: npm test

      - name: Dry-run the data package's JSR publication
        # JSR's own command-line tool, which runs the registry's publisher
        # itself; libmorpheus does not depend on Deno.
        working-directory: bindings/js/data
        run: npx --yes jsr@0.14.3 publish --dry-run --allow-dirty

      - name: Acquire the runtime subset with the data package and analyze it
        # The subset the tool writes must be the subset the WebAssembly
        # facade documents: open a context over the manifest's files with
        # the Node.js binding's native runtime and analyze one form per
        # language. The Alpheios acquisition also rebuilds gener.index.
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/dev/libmorpheus.so
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/dev/node/libmorpheus_node.node
        working-directory: bindings/js/data
        run: |
          node data.js --dataset perseids --subset runtime --manifest \
            --output ../../../build/data-runtime-acquired
          test -f ../../../build/data-runtime-acquired/stemlib-manifest.json
          test -f ../../../build/data-runtime-acquired/Greek/stemsrc/lemlist
          test -f ../../../build/data-runtime-acquired/Latin/stemsrc/vbs.cmp.ml
          test ! -e ../../../build/data-runtime-acquired/Latin/stemsrc/ls.nom
          node data.js --dataset alpheios --subset runtime --with-gener \
            --output ../../../build/data-runtime-gener-acquired
          cmake -E sha256sum \
            ../../../build/data-runtime-gener-acquired/gener.index | \
            grep -F '5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6'
          node --input-type=module -e '
            import { MorpheusLanguage, MorpheusLibrary } from "../node/index.js";
            const library = new MorpheusLibrary(process.env.MORPHEUS_LIBRARY);
            const root = "../../../build/data-runtime-acquired";
            for (const [language, word, lemma] of [[MorpheusLanguage.Greek, "e)/kstasis", "e)/kstasis"], [MorpheusLanguage.Latin, "rosarum", "rosa"]]) {
              const context = library.createContext(root, language);
              const analyses = await context.analyze(word);
              if (!analyses.some((analysis) => analysis.lemma === lemma)) throw new Error(`${word}: ${JSON.stringify(analyses)}`);
              await context.close();
            }
            library.close();
          '

      - name: Verify npm package contents
        working-directory: bindings/js/node
        run: |
          # The data package was linked for the tests; packaging must see
          # the tree as a consumer's npm would, without it.
          rm -rf node_modules
          npm pack --dry-run --ignore-scripts
          node package-platform.mjs \
            linux-x64-gnu \
            ../../../build/dev/node/libmorpheus_node.node \
            ../../../build/dev/npm-node-linux-x64-gnu
          npm pack --dry-run --ignore-scripts \
            ../../../build/dev/npm-node-linux-x64-gnu
          test ! -e node_modules

  python:
    name: Python binding (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - name: Check out sources
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Build native runtime and generation fixture
        run: |
          cmake --preset dev
          cmake --build --preset dev --target \
            morpheus morpheus_gener_index_builder
          build/dev/morpheus_gener_index_builder \
            stemlib/gener.index test/generation-service-source.txt

      - name: Test ctypes binding against the ABI fixture
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: bindings/python/src
        run: >-
          python -B -m unittest discover
          -s bindings/python/test -v

      - name: Test against the compiled runtime and stem data
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: bindings/python/src
        run: >-
          python -B bindings/python/test/runtime_smoke.py
          build/dev/libmorpheus.so stemlib

      - name: Acquire the declared runtime and both datasets with the package's commands
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          PYTHONPATH: bindings/python/src
        run: |
          python -B -m libmorpheus.native --output build/python-native-acquired
          test -f build/python-native-acquired/MORPHEUS-NATIVE.json
          test -f build/python-native-acquired/lib/libmorpheus.so
          python -B -m libmorpheus.data --dataset perseids --subset runtime --manifest \
            --output build/python-data-acquired
          test -f build/python-data-acquired/stemlib-manifest.json
          test -f build/python-data-acquired/Latin/stemsrc/vbs.cmp.ml
          test ! -e build/python-data-acquired/Latin/stemsrc/ls.nom
          # The fixture index is not the pinned one: the command must refuse
          # it before downloading anything and leave no output behind.
          if python -B -m libmorpheus.data --dataset alpheios --languages grc \
              --gener-index stemlib/gener.index \
              --output build/python-alpheios-acquired; then
            echo "an unpinned generation index was accepted" >&2
            exit 1
          fi
          test ! -e build/python-alpheios-acquired
          python -B - <<'PY'
          import json
          import libmorpheus as m
          native = json.load(open("build/python-native-acquired/MORPHEUS-NATIVE.json"))
          assert native["nativeVersion"] == m.MORPHEUS_NATIVE_VERSION, native
          data = json.load(open("build/python-data-acquired/MORPHEUS-DATA.json"))
          assert data["subset"]["name"] == "runtime" and data["languages"] == ["grc", "lat"], data
          with m.Library("build/python-native-acquired/lib/libmorpheus.so") as library:
              with library.context("build/python-data-acquired", m.Language.LATIN) as context:
                  assert any(a.lemma == "amo" for a in context.analyze("amatus"))
              with library.context("build/python-data-acquired", m.Language.GREEK) as context:
                  assert any(a.lemma == "e)/kstasis" for a in context.analyze("e)/kstasis"))
          print("acquired runtime", native["nativeVersion"], "and data analyze Latin and Greek")
          PY

      - name: Build and inspect universal distributions
        run: |
          python -m pip install build==1.3.0
          python -m build bindings/python
          python - <<'PY'
          from pathlib import Path
          import zipfile

          wheels = list(Path("bindings/python/dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          assert wheels[0].name.endswith("-py3-none-any.whl"), wheels[0]
          with zipfile.ZipFile(wheels[0]) as archive:
              names = archive.namelist()
          assert "libmorpheus/__init__.py" in names
          assert "libmorpheus/_abi.py" in names
          assert "libmorpheus/_library.py" in names
          assert "libmorpheus/_types.py" in names
          assert "libmorpheus/_version.py" in names
          assert "libmorpheus/_acquisition.py" in names
          assert "libmorpheus/_cli.py" in names
          assert "libmorpheus/_manifest.py" in names
          assert "libmorpheus/native.py" in names
          assert "libmorpheus/data.py" in names
          assert "libmorpheus/setup.py" in names
          assert "libmorpheus/py.typed" in names
          assert not [name for name in names if name.startswith("test/") or "stemlib" in name]
          entry_points = next(name for name in names if name.endswith("/entry_points.txt"))
          with zipfile.ZipFile(wheels[0]) as archive:
              scripts = archive.read(entry_points).decode()
          for command in ("libmorpheus-native", "libmorpheus-data", "libmorpheus-setup"):
              assert f"{command} = libmorpheus._cli:" in scripts, scripts
          assert any(name.endswith("/licenses/LICENSE") for name in names)
          assert any(name.endswith("/licenses/NOTICE") for name in names)
          PY

      - name: Install and import the wheel
        run: |
          expected="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path("bindings/python/pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          python -m pip install --no-deps bindings/python/dist/*.whl
          cd "$RUNNER_TEMP"
          python -c \
            "import libmorpheus; assert libmorpheus.__version__ == '$expected', libmorpheus.__version__"
          libmorpheus-native --help > /dev/null
          libmorpheus-data --help > /dev/null
          libmorpheus-setup --help > /dev/null

  char-signedness:
    if: github.event_name == 'push'
    name: Byte conversions (${{ matrix.char_mode }} char)
    strategy:
      matrix:
        char_mode: [signed, unsigned]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out sources
        uses: actions/checkout@v5

      - name: Configure
        env:
          CFLAGS: -f${{ matrix.char_mode }}-char
        run: cmake -S . -B build/char-mode -G Ninja

      - name: Build byte portability tests
        run: >-
          cmake --build build/char-mode --target
          morpheus_byte_conversion_test morpheus_byte_collation_test

      - name: Test byte portability
        run: |
          ./build/char-mode/morpheus_byte_conversion_test
          ./build/char-mode/morpheus_byte_collation_test

  legacy-make:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Build runtime with the inherited Makefiles
        run: |
          make -C src clean
          CFLAGS='-std=c17 -fcommon' make -C src libs
          CFLAGS='-std=c17 -fcommon' make -C src/anal cruncher
