name: Published PyPI smoke test

on:
  workflow_run:
    workflows:
      - Publish Python binding
    types:
      - completed
  workflow_dispatch:
    inputs:
      package_version:
        description: Published libmorpheus version
        required: true
        default: 0.2.0
        type: string

permissions:
  contents: read

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'workflow_dispatch' && inputs.package_version ||
      github.event.workflow_run.head_sha
    }}
  cancel-in-progress: false

jobs:
  published-pypi-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    name: Install the public wheel and exercise the native runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out runtime sources and stem data
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Install the published wheel in an empty environment
        env:
          REQUESTED_VERSION: ${{ inputs.package_version }}
        run: |
          package_version="$REQUESTED_VERSION"
          if test -z "$package_version"; then
            package_version="$(python - <<'PY'
          import sys
          sys.path.insert(0, "bindings/python/src")
          import libmorpheus
          print(libmorpheus.MORPHEUS_PYTHON_VERSION)
          PY
          )"
          fi
          if ! [[ "$package_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid package version: $package_version" >&2
            exit 1
          fi
          python -m venv "$RUNNER_TEMP/python-pypi-smoke"
          for attempt in $(seq 1 20); do
            if "$RUNNER_TEMP/python-pypi-smoke/bin/python" -m pip install \
                --index-url https://pypi.org/simple --no-cache-dir \
                --only-binary=:all: --no-deps \
                "libmorpheus==$package_version"; then
              break
            fi
            if test "$attempt" = 20; then
              echo "Published wheel did not become visible on PyPI." >&2
              exit 1
            fi
            sleep 15
          done
          "$RUNNER_TEMP/python-pypi-smoke/bin/python" -c \
            "import libmorpheus; assert libmorpheus.__version__ == '$package_version'"

      - name: Build the compatible native runtime and generation fixture
        run: |
          cmake --preset dev
          cmake --build --preset dev --target \
            morpheus morpheus_gener_index_builder
          build/dev/morpheus_gener_index_builder \
            stemlib/gener.index test/generation-service-source.txt

      - name: Analyze Greek and Latin and generate Greek forms
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-pypi-smoke/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/test/runtime_smoke.py" \
            "$GITHUB_WORKSPACE/build/dev/libmorpheus.so" \
            "$GITHUB_WORKSPACE/stemlib"

      - name: Acquire the declared runtime and the Perseids data with the published commands
        # The public endpoints, as an application would use them: the
        # declared native release and the pinned dataset, then an analysis
        # through what was acquired.
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-pypi-smoke/bin/libmorpheus-setup" \
            --dataset perseids \
            --native-output "$RUNNER_TEMP/acquired-native" \
            --data-output "$RUNNER_TEMP/acquired-data"
          test -f "$RUNNER_TEMP/acquired-native/MORPHEUS-NATIVE.json"
          test -f "$RUNNER_TEMP/acquired-data/MORPHEUS-DATA.json"
          "$RUNNER_TEMP/python-pypi-smoke/bin/python" - <<'PY'
          import json, os
          import libmorpheus as m
          temp = os.environ["RUNNER_TEMP"]
          native = json.load(open(f"{temp}/acquired-native/MORPHEUS-NATIVE.json"))
          assert native["nativeVersion"] == m.MORPHEUS_NATIVE_VERSION, native
          with m.Library(f"{temp}/acquired-native/{native['libraryPath']}") as library:
              with library.context(f"{temp}/acquired-data", m.Language.LATIN) as context:
                  assert any(a.lemma == "amo" for a in context.analyze("amatus"))
              with library.context(f"{temp}/acquired-data", m.Language.GREEK) as context:
                  assert any(a.lemma == "e)/kstasis" for a in context.analyze("e)/kstasis"))
          print("acquired runtime and data analyze Latin and Greek")
          PY
