# SPDX-License-Identifier: AGPL-3.0-or-later

name: Publish Python binding

on:
  push:
    tags:
      - 'python-v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing Python binding tag to publish or recover
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: python-release-${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
  cancel-in-progress: false

jobs:
  publish-python:
    name: Publish universal wheel and source distribution
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: pypi
      url: https://pypi.org/p/libmorpheus
    steps:
      - name: Check out the binding tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Verify independent versions and native release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^python-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"
          release_sha="$(git rev-list -n 1 "refs/tags/$RELEASE_TAG")"
          test "$(git rev-parse HEAD)" = "$release_sha"

          metadata="$(PYTHONPATH=bindings/python/src python - <<'PY'
          import tomllib
          from pathlib import Path
          import libmorpheus

          project = tomllib.loads(
              Path("bindings/python/pyproject.toml").read_text(encoding="utf-8")
          )["project"]
          assert project["version"] == libmorpheus.MORPHEUS_PYTHON_VERSION
          assert libmorpheus.__version__ == libmorpheus.MORPHEUS_PYTHON_VERSION
          print(
              libmorpheus.MORPHEUS_PYTHON_VERSION,
              libmorpheus.MORPHEUS_NATIVE_VERSION,
              libmorpheus.MORPHEUS_NATIVE_ABI_VERSION,
          )
          PY
          )"
          read -r package_version native_version native_abi <<<"$metadata"
          test "$RELEASE_TAG" = "python-v$package_version"

          release_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/v$native_version")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.published_at' <<<"$release_json")" != null

          echo "release-sha=$release_sha" >> "$GITHUB_OUTPUT"
          echo "package-version=$package_version" >> "$GITHUB_OUTPUT"

      - name: Wait for tagged Linux qualification
        uses: actions/github-script@v8
        env:
          RELEASE_SHA: ${{ steps.metadata.outputs.release-sha }}
        with:
          script: |
            const deadline = Date.now() + 15 * 60 * 1000
            while (Date.now() < deadline) {
              const result = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                event: 'push',
                head_sha: process.env.RELEASE_SHA,
                per_page: 10,
              })
              const run = result.data.workflow_runs.find((candidate) =>
                candidate.head_sha === process.env.RELEASE_SHA
              )
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Linux CI ${run.html_url} concluded ${run.conclusion}`,
                  )
                }
                core.info(`Linux CI passed: ${run.html_url}`)
                return
              }
              core.info(run === undefined
                ? 'Waiting for Linux CI to appear.'
                : `Waiting for Linux CI ${run.html_url}: ${run.status}.`)
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
            throw new Error('Timed out waiting for tagged Linux qualification')

      - name: Build and inspect distributions
        run: |
          python -m pip install build==1.6.1 twine==6.2.0
          python -m build bindings/python
          python -m twine check bindings/python/dist/*
          python - <<'PY'
          from pathlib import Path
          import tarfile
          import zipfile

          distributions = Path("bindings/python/dist")
          wheels = list(distributions.glob("*.whl"))
          sdists = list(distributions.glob("*.tar.gz"))
          assert len(wheels) == 1 and len(sdists) == 1
          assert wheels[0].name.endswith("-py3-none-any.whl")
          with zipfile.ZipFile(wheels[0]) as archive:
              wheel_names = archive.namelist()
          with tarfile.open(sdists[0], "r:gz") as archive:
              sdist_names = archive.getnames()
          for expected in ("_abi.py", "_library.py", "_types.py", "_version.py"):
              assert any(name.endswith(f"libmorpheus/{expected}") for name in wheel_names)
              assert any(name.endswith(f"libmorpheus/{expected}") for name in sdist_names)
          PY

      - name: Test the built wheel in an isolated environment
        run: |
          python -m venv "$RUNNER_TEMP/python-wheel-test"
          "$RUNNER_TEMP/python-wheel-test/bin/python" -m pip install \
            --no-deps bindings/python/dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/python-wheel-test/bin/python" \
            "$GITHUB_WORKSPACE/bindings/python/test/test_binding.py"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: bindings/python/dist
          skip-existing: true

  github-release:
    name: Publish the GitHub release from the PyPI registry files
    needs: publish-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
    steps:
      - name: Check out the binding tag
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Stage the published files, verified against the registry
        run: |
          python3 -I tools/registry-release-assets.py pypi \
            "${RELEASE_TAG#python-v}" "$RUNNER_TEMP/release-assets"

      - name: Create or complete the release
        uses: actions/github-script@v8
        env:
          ASSET_DIRECTORY: ${{ runner.temp }}/release-assets
        with:
          script: |
            const publish = require('./.github/scripts/binding-release.cjs')
            const { execSync } = require('child_process')
            const tag = process.env.RELEASE_TAG
            const sha = execSync('git rev-parse HEAD').toString().trim()
            await publish({ github, context, core, tag, sha, assetDirectory: process.env.ASSET_DIRECTORY })
