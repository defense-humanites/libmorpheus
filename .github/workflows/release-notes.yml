# SPDX-License-Identifier: AGPL-3.0-or-later
#
# Bring published GitHub releases in line with docs/release-notes/: the tag as
# title, the notes file as body. Tags and assets are never touched; a tag
# without a release is reported, not created. Creating a release on an
# existing tag whose workflow files differ from main's requires the
# `workflows` permission, which a workflow's token cannot hold, so the
# missing Node.js and Python releases are created from the maintainer's
# machine with tools/backfill-binding-releases.sh. Run manually, on the
# maintainer's authorization.

name: Release notes

on:
  workflow_dispatch:
    inputs:
      tags:
        description: Space-separated tags, or "all" for every docs/release-notes file
        required: true
        default: all
        type: string

permissions:
  contents: write

concurrency:
  group: release-notes
  cancel-in-progress: false

jobs:
  update:
    name: Update release titles and notes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out main
        uses: actions/checkout@v5

      - name: Apply titles and notes
        uses: actions/github-script@v8
        env:
          REQUESTED: ${{ inputs.tags }}
        with:
          script: |
            const fs = require('fs')
            const owner = context.repo.owner
            const repo = context.repo.repo
            const tags = process.env.REQUESTED.trim() === 'all'
              ? fs.readdirSync('docs/release-notes').map((name) => name.replace(/\.md$/, '')).sort()
              : process.env.REQUESTED.split(/\s+/).filter(Boolean)
            const missing = []
            const failed = []
            for (const tag of tags) {
              const notes = `docs/release-notes/${tag}.md`
              if (!fs.existsSync(notes)) {
                failed.push(`${tag}: no ${notes}`)
                continue
              }
              const body = fs.readFileSync(notes, 'utf8')
              try {
                let release
                try {
                  release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data
                } catch (error) {
                  if (error.status !== 404) throw error
                }
                if (release === undefined) {
                  missing.push(tag)
                } else if (release.name === tag && release.body === body) {
                  core.info(`${tag}: already current`)
                } else {
                  await github.rest.repos.updateRelease({
                    owner, repo, release_id: release.id, name: tag, body,
                  })
                  core.info(`${tag}: title and notes updated`)
                }
              } catch (error) {
                failed.push(`${tag}: ${error.message}`)
              }
            }
            if (missing.length) {
              core.notice(`No GitHub release (create with tools/backfill-binding-releases.sh): ${missing.join(' ')}`)
            }
            if (failed.length) core.setFailed(failed.join('\n'))
