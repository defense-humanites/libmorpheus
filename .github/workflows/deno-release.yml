# SPDX-License-Identifier: AGPL-3.0-or-later

name: Publish Deno binding

on:
  push:
    tags:
      - 'deno-v*'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-deno:
    name: Publish standalone archive and JSR package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - name: Check out the binding tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.5

      - name: Verify independent versions and native release
        id: metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          binding_version="$(deno eval \
            'console.log(JSON.parse(await Deno.readTextFile("bindings/js/deno/jsr.json")).version)')"
          declared="$(deno eval \
            'import { MORPHEUS_DENO_VERSION, MORPHEUS_NATIVE_ABI_VERSION, MORPHEUS_NATIVE_VERSION } from "./bindings/js/deno/internal/version.ts"; console.log(`${MORPHEUS_DENO_VERSION} ${MORPHEUS_NATIVE_VERSION} ${MORPHEUS_NATIVE_ABI_VERSION}`)')"
          read -r declared_binding native_version native_abi <<<"$declared"
          test "$binding_version" = "$declared_binding"
          test "$GITHUB_REF_NAME" = "deno-v$binding_version"
          case "$native_version" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "Invalid native version: $native_version" >&2; exit 1 ;;
          esac
          case "$native_abi" in
            ''|*[!0-9]*) echo "Invalid native ABI: $native_abi" >&2; exit 1 ;;
          esac

          release_json="$(gh api \
            "repos/$GITHUB_REPOSITORY/releases/tags/v$native_version")"
          test "$(jq -r '.draft' <<<"$release_json")" = false
          test "$(jq -r '.published_at' <<<"$release_json")" != null
          expected_native_assets="$(printf '%s\n' \
            "libmorpheus-$native_version-Linux-aarch64-glibc.tar.gz" \
            "libmorpheus-$native_version-Linux-aarch64-glibc.tar.gz.sha256" \
            "libmorpheus-$native_version-Linux-x86_64-glibc.tar.gz" \
            "libmorpheus-$native_version-Linux-x86_64-glibc.tar.gz.sha256" \
            "libmorpheus-$native_version-macOS-arm64.tar.gz" \
            "libmorpheus-$native_version-macOS-arm64.tar.gz.sha256" | sort)"
          actual_native_assets="$(jq -r '.assets[].name' <<<"$release_json" | \
            grep -E "^libmorpheus-$native_version-(Linux|macOS)" | sort)"
          test "$actual_native_assets" = "$expected_native_assets"

          echo "binding-version=$binding_version" >>"$GITHUB_OUTPUT"
          echo "native-version=$native_version" >>"$GITHUB_OUTPUT"
          echo "native-abi=$native_abi" >>"$GITHUB_OUTPUT"

      - name: Wait for Linux qualification
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000
            while (Date.now() < deadline) {
              const result = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                event: 'push',
                head_sha: context.sha,
                per_page: 10,
              })
              const run = result.data.workflow_runs.find((candidate) =>
                candidate.head_sha === context.sha &&
                candidate.id !== context.runId
              )
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Linux CI ${run.html_url} concluded ${run.conclusion}`,
                  )
                }
                core.info(`Linux CI passed: ${run.html_url}`)
                return
              }
              core.info(
                run === undefined
                  ? 'Waiting for Linux CI to appear.'
                  : `Waiting for Linux CI ${run.html_url}: ${run.status}.`,
              )
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
            throw new Error('Timed out waiting for Linux CI')

      - name: Verify JSR package contents
        working-directory: bindings/js/deno
        run: |
          deno check mod.ts data.ts native.ts setup.ts
          deno lint --rules-include=no-slow-types mod.ts
          deno publish --dry-run

      - name: Build standalone binding archive
        env:
          PACKAGE_DIR: ${{ runner.temp }}/deno-binding-package
        run: |
          mkdir -p "$PACKAGE_DIR"
          cmake \
            -DMORPHEUS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DMORPHEUS_BUILD_DIR="$RUNNER_TEMP/deno-binding-build" \
            -DMORPHEUS_PACKAGE_DIR="$PACKAGE_DIR" \
            -P test/package-deno-binding.cmake
          cmake \
            -DMORPHEUS_SOURCE_DIR="$GITHUB_WORKSPACE" \
            -DMORPHEUS_BUILD_DIR="$RUNNER_TEMP/deno-binding-build" \
            -DMORPHEUS_PACKAGE_DIR="$PACKAGE_DIR" \
            -P test/test-deno-binding-package.cmake

      - name: Publish standalone binding release
        uses: actions/github-script@v8
        env:
          BINDING_VERSION: ${{ steps.metadata.outputs.binding-version }}
          NATIVE_VERSION: ${{ steps.metadata.outputs.native-version }}
          NATIVE_ABI: ${{ steps.metadata.outputs.native-abi }}
          PACKAGE_DIR: ${{ runner.temp }}/deno-binding-package
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const tag = `deno-v${process.env.BINDING_VERSION}`
            const expected = [
              `libmorpheus-deno-${process.env.BINDING_VERSION}.tar.gz`,
              `libmorpheus-deno-${process.env.BINDING_VERSION}.tar.gz.sha256`,
            ]
            let existing
            try {
              existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag,
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (existing === undefined) {
              const notesPath = `docs/release-deno-${process.env.BINDING_VERSION}.md`
              const body = fs.existsSync(notesPath)
                ? fs.readFileSync(notesPath, 'utf8')
                : `Compatible native runtime: ${process.env.NATIVE_VERSION} (ABI ${process.env.NATIVE_ABI}).`
              existing = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: `libmorpheus Deno binding ${process.env.BINDING_VERSION}`,
                body,
                draft: true,
                prerelease: false,
              })
            }
            if (existing.data.draft) {
              const uploaded = new Set(
                existing.data.assets.map((asset) => asset.name),
              )
              for (const name of expected.filter((name) => !uploaded.has(name))) {
                const data = fs.readFileSync(path.join(process.env.PACKAGE_DIR, name))
                await github.rest.repos.uploadReleaseAsset({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: existing.data.id,
                  name,
                  data,
                  headers: {
                    'content-type': 'application/octet-stream',
                    'content-length': data.length,
                  },
                })
              }
              existing = await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: existing.data.id,
                draft: false,
                make_latest: 'false',
              })
            }
            if (existing.data.draft) {
              throw new Error(`Binding release remains a draft: ${existing.data.html_url}`)
            }
            const published = new Set(existing.data.assets.map((asset) => asset.name))
            const missing = expected.filter((name) => !published.has(name))
            if (missing.length !== 0) {
              throw new Error(`Binding release is missing: ${missing.join(', ')}`)
            }
            core.info(`Published binding release: ${existing.data.html_url}`)

      - name: Publish JSR package
        working-directory: bindings/js/deno
        run: deno publish
