# SPDX-License-Identifier: AGPL-3.0-or-later

name: Platform and release qualification

on:
  pull_request:
    paths:
      - '.github/workflows/node-release.yml'
      - '.github/workflows/platform.yml'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'Dockerfile'
      - 'test/test-fixtures.cmake'
      - 'test/test-installed-package.cmake'
      - 'test/test-installed-pkgconfig.cmake'
      - 'test/test-release-package.cmake'
      - 'test/package-deno-binding.cmake'
      - 'test/test-deno-binding-package.cmake'
      - 'bindings/js/deno/**'
      - 'bindings/js/node/**'
      - 'tools/prepare-runtime-data.sh'
  push:
    tags:
      - 'v*'
      - 'node-v*'
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      package_artifacts:
        description: Build and verify the three native release-candidate packages
        required: true
        default: true
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ ! startsWith(github.ref, 'refs/tags/') }}

jobs:
  activity:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      package-artifacts: ${{ steps.activity.outputs.package-artifacts }}
      run-platforms: ${{ steps.activity.outputs.run-platforms }}
    steps:
      - name: Decide whether platform qualification is required
        id: activity
        uses: actions/github-script@v8
        with:
          script: |
            const packageArtifacts = context.eventName === 'pull_request' ||
              context.ref.startsWith('refs/tags/') ||
              (context.eventName === 'workflow_dispatch' &&
                String(context.payload.inputs?.package_artifacts) === 'true')
            core.setOutput('package-artifacts', String(packageArtifacts))

            if (context.eventName === 'pull_request') {
              core.info(
                'Validate the Linux x86-64 package without running costly ' +
                'architecture jobs.',
              )
              core.setOutput('run-platforms', 'false')
              return
            }

            if (context.eventName !== 'schedule') {
              core.info('Manual and version-tag runs always qualify platforms.')
              core.setOutput('run-platforms', 'true')
              return
            }

            const current = await github.rest.actions.getWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            })
            const history = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: current.data.workflow_id,
              event: 'schedule',
              per_page: 10,
            })
            const previous = history.data.workflow_runs.find((run) =>
              run.id !== context.runId && run.status === 'completed'
            )
            const runPlatforms = previous === undefined ||
              previous.head_sha !== context.sha ||
              previous.conclusion !== 'success'

            if (previous === undefined) {
              core.info('No previous scheduled run exists; qualify platforms.')
            } else {
              core.info(
                `Previous scheduled run: ${previous.id}, ` +
                `SHA ${previous.head_sha}, conclusion ${previous.conclusion}.`,
              )
              core.info(`Current SHA: ${context.sha}.`)
            }
            core.setOutput('run-platforms', String(runPlatforms))

  linux-x86_64-package:
    needs: activity
    if: needs.activity.outputs.package-artifacts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate Node-API headers
        id: node
        run: |
          node_prefix="$(node -p \
            "require('node:path').resolve(process.execPath, '../..')")"
          test -f "$node_prefix/include/node/node_api.h"
          echo "include=$node_prefix/include/node" >> "$GITHUB_OUTPUT"

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DMORPHEUS_BUILD_NODE_BINDING=ON
          -DMORPHEUS_NODE_INCLUDE_DIR=${{ steps.node.outputs.include }}
          -DMORPHEUS_PACKAGE_PLATFORM=Linux-x86_64-glibc

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test optimized release and installed surface
        run: ctest --preset release

      - name: Verify native library architecture and dependencies
        run: |
          library="$(readlink -f build/release/libmorpheus.so)"
          file "$library"
          readelf -h "$library" | grep -F 'Machine:' | \
            grep -F 'Advanced Micro Devices X86-64'
          if ldd "$library" | grep -F 'not found'; then
            exit 1
          fi

      - name: Package optimized release
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native package
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Package Deno binding
        run: >-
          cmake
          -DMORPHEUS_SOURCE_DIR=${{ github.workspace }}
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/package-deno-binding.cmake

      - name: Verify standalone Deno binding package
        run: >-
          cmake
          -DMORPHEUS_SOURCE_DIR=${{ github.workspace }}
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-deno-binding-package.cmake

      - name: Smoke-test generation qualification
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_CRUNCHER: ${{ github.workspace }}/build/release/cruncher
        run: |
          cp build/release/test-gener-corpus/first.mgi stemlib/gener.index
          deno run --allow-env --allow-ffi --allow-read --allow-run \
            bench/compare.ts --iterations 1 --warmup 0 --contexts 1,2 \
            --cold-samples 1 --generation-small 'lo/gos' \
            --generation-maximal 'i(/hmi' --json > /dev/null

      - name: Prepare Node.js generation fixture
        run: >-
          build/release/morpheus_gener_index_builder
          stemlib/gener.index
          test/generation-service-source.txt

      - name: Test Node.js binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/release/node/libmorpheus_node.node
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        working-directory: bindings/js/node
        run: npm test

      - name: Stage and verify Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: |
          file build/release/node/libmorpheus_node.node
          readelf -h build/release/node/libmorpheus_node.node | \
            grep -F 'Machine:' | grep -F 'Advanced Micro Devices X86-64'
          node bindings/js/node/package-platform.mjs \
            linux-x64-gnu \
            build/release/node/libmorpheus_node.node \
            build/release/npm-node-linux-x64-gnu
          npm pack --dry-run --ignore-scripts \
            ./build/release/npm-node-linux-x64-gnu
          npm pack --dry-run --ignore-scripts ./bindings/js/node

      - name: Preserve native package
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-linux-x86_64
          path: build/release/packages/libmorpheus-[0-9]*.tar.gz*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Deno binding package
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-deno-binding
          path: build/release/packages/libmorpheus-deno-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-node-linux-x64-gnu
          path: build/release/npm-node-linux-x64-gnu
          if-no-files-found: error
          retention-days: 14

  linux-aarch64:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = aarch64

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate Node-API headers
        id: node
        run: |
          node_prefix="$(node -p \
            "require('node:path').resolve(process.execPath, '../..')")"
          test -f "$node_prefix/include/node/node_api.h"
          echo "include=$node_prefix/include/node" >> "$GITHUB_OUTPUT"

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DMORPHEUS_BUILD_NODE_BINDING=ON
          -DMORPHEUS_NODE_INCLUDE_DIR=${{ steps.node.outputs.include }}
          -DMORPHEUS_PACKAGE_PLATFORM=Linux-aarch64-glibc

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test native runtime and installed surface
        run: ctest --preset release

      - name: Verify native library architecture and dependencies
        run: |
          library="$(readlink -f build/release/libmorpheus.so)"
          file "$library"
          readelf -h "$library" | grep -F 'Machine:' | grep -F AArch64
          if ldd "$library" | grep -F 'not found'; then
            exit 1
          fi

      - name: Check binding
        run: deno check bindings/js/deno/mod.ts bindings/js/deno/test/mod_test.ts

      - name: Prepare Deno generation fixture
        run: >-
          build/release/morpheus_gener_index_builder
          stemlib/gener.index
          test/generation-service-source.txt

      - name: Test binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_ALPHEIOS_STEMLIB: ${{ github.workspace }}/vendor/alpheios-morpheus/dist/stemlib
        run: deno test --allow-env --allow-ffi bindings/js/deno/test/mod_test.ts

      - name: Test Node.js binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/release/node/libmorpheus_node.node
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        working-directory: bindings/js/node
        run: npm test

      - name: Stage and verify Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: |
          file build/release/node/libmorpheus_node.node
          readelf -h build/release/node/libmorpheus_node.node | \
            grep -F 'Machine:' | grep -F AArch64
          node bindings/js/node/package-platform.mjs \
            linux-arm64-gnu \
            build/release/node/libmorpheus_node.node \
            build/release/npm-node-linux-arm64-gnu
          npm pack --dry-run --ignore-scripts \
            ./build/release/npm-node-linux-arm64-gnu

      - name: Smoke-test generation qualification
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.so
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_CRUNCHER: ${{ github.workspace }}/build/release/cruncher
        run: |
          cp build/release/test-gener-corpus/first.mgi stemlib/gener.index
          deno run --allow-env --allow-ffi --allow-read --allow-run \
            bench/compare.ts --iterations 1 --warmup 0 --contexts 1,2 \
            --cold-samples 1 --generation-small 'lo/gos' \
            --generation-maximal 'i(/hmi' --json > /dev/null

      - name: Package release candidate
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Preserve native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-linux-aarch64-glibc
          path: build/release/packages/libmorpheus-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-node-linux-arm64-gnu
          path: build/release/npm-node-linux-arm64-gnu
          if-no-files-found: error
          retention-days: 14

  alpine:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    name: Alpine (${{ matrix.architecture }})
    strategy:
      matrix:
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = "${{ matrix.architecture }}"

      - name: Build and test Alpine runtime image
        run: docker build --target runtime --tag morpheus:ci .

      - name: Smoke-test cruncher image
        run: |
          output="$(printf 'a)/nqrwpos\n' | docker run --rm -i morpheus:ci -S)"
          test -n "$output"
          docker run --rm --entrypoint sh morpheus:ci -c \
            'echo "5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6  /opt/morpheus/share/morpheus/stemlib/gener.index" | sha256sum -c -'

      - name: Build Alpine Deno base image
        run: docker build --target deno-runtime --tag morpheus-deno:ci .

      - name: Smoke-test Deno analysis and generation
        run: |
          docker run --rm --entrypoint sh morpheus-deno:ci -c \
            'echo "5aa76d8c86c54af5121a3cce506ecaa57d14c6667ac0f091efd164ddfa9822d6  /opt/morpheus/share/morpheus/stemlib/gener.index" | sha256sum -c -'
          docker run --rm --entrypoint sh morpheus-deno:ci -c \
            'test ! -e /opt/morpheus/share/morpheus/deno'
          docker run --rm morpheus-deno:ci eval \
            --minimum-dependency-age=0 \
            --allow-env=MORPHEUS_LIBRARY,MORPHEUS_STEMLIB \
            --allow-ffi=/opt/morpheus/lib/libmorpheus.so \
            --allow-read=/opt/morpheus/share/morpheus/stemlib '
            import {
              MorpheusLanguage,
              MorpheusLibrary,
              MorpheusOption,
            } from "jsr:@libmorpheus/deno@0.4.1";
            using library = new MorpheusLibrary(
              Deno.env.get("MORPHEUS_LIBRARY")!,
            );
            await using context = library.createContext(
              Deno.env.get("MORPHEUS_STEMLIB")!,
              MorpheusLanguage.Greek,
            );
            const formerlyCrashing = await context.analyze(
              "a)mfestan", MorpheusOption.IgnoreAccents,
            );
            if (formerlyCrashing.length === 0) {
              throw new Error("a)mfestan analysis smoke failed");
            }
            const analyses = await context.analyze("a)/nqrwpos");
            if (analyses.length === 0) throw new Error("analysis smoke failed");
            for (const [word, expected] of [["a)nalow", 26], ["a(napinw", 39]]) {
              const found = await context.analyze(word, MorpheusOption.IgnoreAccents);
              if (found.length !== expected) {
                throw new Error(`${word}: expected ${expected} analyses, got ${found.length}`);
              }
            }
            const forms = await context.generate("lo/gos");
            if (forms.length === 0) throw new Error("generation smoke failed");
            if (!forms.some((form) => form.grammaticalNumber === "dual")) {
              throw new Error("generation lost dual forms");
            }
          '

  apple-silicon:
    needs: activity
    if: needs.activity.outputs.run-platforms == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out sources and stemlib
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Verify native architecture
        run: test "$(uname -m)" = arm64

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Locate Node-API headers
        id: node
        run: |
          node_prefix="$(node -p \
            "require('node:path').resolve(process.execPath, '../..')")"
          test -f "$node_prefix/include/node/node_api.h"
          echo "include=$node_prefix/include/node" >> "$GITHUB_OUTPUT"

      - name: Configure optimized release
        run: >-
          cmake --preset release -DBUILD_TESTING=ON
          -DCMAKE_OSX_ARCHITECTURES=arm64
          -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
          -DMORPHEUS_BUILD_NODE_BINDING=ON
          -DMORPHEUS_NODE_INCLUDE_DIR=${{ steps.node.outputs.include }}
          -DMORPHEUS_PACKAGE_PLATFORM=macOS-arm64

      - name: Build optimized release
        run: cmake --build --preset release

      - name: Test native runtime and installed surface
        run: ctest --preset release

      - name: Verify dynamic-library contract
        run: |
          library=build/release/libmorpheus.dylib
          test "$(lipo -archs "$library")" = arm64
          install_name="$(otool -D "$library" | sed -n '2p')"
          echo "install name: $install_name"
          [[ "$install_name" =~ ^@rpath/libmorpheus\.[0-9]+\.dylib$ ]]
          install_name_file="build/release/${install_name#@rpath/}"
          test -e "$install_name_file"
          test "$library" -ef "$install_name_file"
          if otool -L "$library" | grep -F '${{ github.workspace }}'; then
            exit 1
          fi
          deployment_target="$(
            otool -l "$library" |
              awk '$1 == "cmd" && $2 == "LC_BUILD_VERSION" { found = 1 }
                   found && $1 == "minos" { print $2; exit }'
          )"
          case "$deployment_target" in
            11.0|11.0.*) ;;
            *) echo "unexpected deployment target: $deployment_target" >&2; exit 1 ;;
          esac

      - name: Check binding
        run: deno check bindings/js/deno/mod.ts bindings/js/deno/test/mod_test.ts

      - name: Prepare Deno generation fixture
        run: >-
          build/release/morpheus_gener_index_builder
          stemlib/gener.index
          test/generation-service-source.txt

      - name: Test binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.dylib
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_ALPHEIOS_STEMLIB: ${{ github.workspace }}/vendor/alpheios-morpheus/dist/stemlib
        run: deno test --allow-env --allow-ffi bindings/js/deno/test/mod_test.ts

      - name: Test Node.js binding
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.dylib
          MORPHEUS_NODE_ADDON: ${{ github.workspace }}/build/release/node/libmorpheus_node.node
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
        working-directory: bindings/js/node
        run: npm test

      - name: Stage and verify Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: |
          test "$(lipo -archs \
            build/release/node/libmorpheus_node.node)" = arm64
          node bindings/js/node/package-platform.mjs \
            darwin-arm64 \
            build/release/node/libmorpheus_node.node \
            build/release/npm-node-darwin-arm64
          npm pack --dry-run --ignore-scripts \
            ./build/release/npm-node-darwin-arm64

      - name: Smoke-test generation qualification
        env:
          MORPHEUS_LIBRARY: ${{ github.workspace }}/build/release/libmorpheus.dylib
          MORPHEUS_STEMLIB: ${{ github.workspace }}/stemlib
          MORPHEUS_CRUNCHER: ${{ github.workspace }}/build/release/cruncher
        run: |
          cp build/release/test-gener-corpus/first.mgi stemlib/gener.index
          deno run --allow-env --allow-ffi --allow-read --allow-run \
            bench/compare.ts --iterations 1 --warmup 0 --contexts 1,2 \
            --cold-samples 1 --generation-small 'lo/gos' \
            --generation-maximal 'i(/hmi' --json > /dev/null

      - name: Package release candidate
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cpack --config build/release/CPackConfig.cmake
          -G TGZ -B build/release/packages

      - name: Verify native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        run: >-
          cmake
          -DMORPHEUS_BUILD_DIR=${{ github.workspace }}/build/release
          -DMORPHEUS_PACKAGE_DIR=${{ github.workspace }}/build/release/packages
          -P test/test-release-package.cmake

      - name: Preserve native release-candidate package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-native-macos-arm64
          path: build/release/packages/libmorpheus-*.tar.gz*
          if-no-files-found: error
          retention-days: 14

      - name: Preserve Node.js platform package
        if: needs.activity.outputs.package-artifacts == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: libmorpheus-node-darwin-arm64
          path: build/release/npm-node-darwin-arm64
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - activity
      - linux-x86_64-package
      - linux-aarch64
      - alpine
      - apple-silicon
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - name: Wait for tagged Linux qualification
        uses: actions/github-script@v8
        with:
          script: |
            const deadline = Date.now() + 10 * 60 * 1000
            while (Date.now() < deadline) {
              const result = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'test.yml',
                event: 'push',
                head_sha: context.sha,
                per_page: 10,
              })
              const run = result.data.workflow_runs.find((candidate) =>
                candidate.head_sha === context.sha
              )
              if (run?.status === 'completed') {
                if (run.conclusion !== 'success') {
                  throw new Error(
                    `Linux CI ${run.html_url} concluded ${run.conclusion}`,
                  )
                }
                core.info(`Linux CI passed: ${run.html_url}`)
                return
              }
              core.info(
                run === undefined
                  ? 'Waiting for the tagged Linux CI run to appear.'
                  : `Waiting for Linux CI ${run.html_url}: ${run.status}.`,
              )
              await new Promise((resolve) => setTimeout(resolve, 15000))
            }
            throw new Error('Timed out waiting for tagged Linux CI')

      - name: Check out the qualified tag
        uses: actions/checkout@v5

      - name: Download native packages
        uses: actions/download-artifact@v5
        with:
          pattern: libmorpheus-native-*
          path: release-assets
          merge-multiple: true

      - name: Verify the release asset set
        run: |
          version="${GITHUB_REF_NAME#v}"
          cp "bench/release-evidence/benchmark-${version}.json"* release-assets/
          expected=(
            "libmorpheus-${version}-Linux-x86_64-glibc.tar.gz"
            "libmorpheus-${version}-Linux-x86_64-glibc.tar.gz.sha256"
            "libmorpheus-${version}-Linux-aarch64-glibc.tar.gz"
            "libmorpheus-${version}-Linux-aarch64-glibc.tar.gz.sha256"
            "libmorpheus-${version}-macOS-arm64.tar.gz"
            "libmorpheus-${version}-macOS-arm64.tar.gz.sha256"
            "benchmark-${version}.json"
            "benchmark-${version}.json.sha256"
          )
          test "$(find release-assets -maxdepth 1 -type f | wc -l)" -eq 8
          for asset in "${expected[@]}"; do
            test -f "release-assets/$asset"
          done
          (cd release-assets && sha256sum -c -- *.sha256)

      - name: Publish qualified GitHub release
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs')
            const path = require('path')
            const directory = 'release-assets'
            const expected = fs.readdirSync(directory).sort()
            let existing
            try {
              existing = await github.rest.repos.getReleaseByTag({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag: context.ref.replace('refs/tags/', ''),
              })
            } catch (error) {
              if (error.status !== 404) throw error
            }
            if (existing !== undefined) {
              if (existing.data.draft) {
                throw new Error(
                  `A partial draft release already exists: ${existing.data.html_url}`,
                )
              }
              const published = new Set(
                existing.data.assets.map((asset) => asset.name),
              )
              const missing = expected.filter((name) => !published.has(name))
              if (missing.length !== 0) {
                throw new Error(
                  `Published release is missing: ${missing.join(', ')}`,
                )
              }
              core.info(`Qualified release already exists: ${existing.data.html_url}`)
              return
            }

            const tag = context.ref.replace('refs/tags/', '')
            const notes = `docs/release-${tag.slice(1)}.md`
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `libmorpheus ${tag.slice(1)}`,
              body: fs.readFileSync(notes, 'utf8'),
              draft: true,
              prerelease: false,
            })
            for (const name of expected) {
              const data = fs.readFileSync(path.join(directory, name))
              await github.rest.repos.uploadReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: release.data.id,
                name,
                data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              })
            }
            const published = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              draft: false,
              make_latest: 'true',
            })
            core.info(`Published qualified release: ${published.data.html_url}`)
