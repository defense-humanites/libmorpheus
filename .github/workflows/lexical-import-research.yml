name: Lexical importer research

on:
  push:
    branches:
      - research/lexical-import
      - research/lexical-arbitration-*
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latin-listall-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Validate and stage the pinned historical LISTALL archive
        run: |
          python3 test/prepare-latin-listall.py
          python3 - <<'PY'
          import os
          from pathlib import Path
          import urllib.request

          url = 'https://downloads.sourceforge.net/project/wwwords/Whitaker/listall.zip'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(8_000_001)
          (Path(os.environ['RUNNER_TEMP']) / 'listall.zip').write_bytes(data)
          PY
          python3 tools/prepare-latin-listall.py \
            --archive "$RUNNER_TEMP/listall.zip" \
            --output "$RUNNER_TEMP/listall-pinned"

  latin-header-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5

      - name: Install historical lexer dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex libfl-dev

      - name: Fetch pinned Lewis and Short TEI file
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/PerseusDL/lexica.git "$RUNNER_TEMP/lexica"
          git -C "$RUNNER_TEMP/lexica" sparse-checkout set --no-cone \
            '/CTS_XML_TEI/perseus/pdllex/lat/ls/lat.ls.perseus-eng1.xml'
          git -C "$RUNNER_TEMP/lexica" checkout \
            56061ca127f4a2844980baffc5f2b6d1332897b3

      - name: Prepare candidate input outside the source tree
        run: |
          python3 -m venv "$RUNNER_TEMP/lexical-python"
          "$RUNNER_TEMP/lexical-python/bin/pip" install lxml==6.1.1
          "$RUNNER_TEMP/lexical-python/bin/python" \
            tools/reconstruct-lexical-exports.py \
            --language Latin \
            --lexica "$RUNNER_TEMP/lexica" \
            --output "$RUNNER_TEMP/lexical-stage"

      - name: Partition Latin headers using TEI evidence
        run: |
          "$RUNNER_TEMP/lexical-python/bin/python" test/reconstruct-lexical-exports.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/reconstruct-lexical-exports.py \
            --language Latin \
            --lexica "$RUNNER_TEMP/lexica/CTS_XML_TEI/perseus/pdllex/lat/ls/lat.ls.perseus-eng1.xml" \
            --output "$RUNNER_TEMP/standalone-latin-stage"
          for name in headers.jsonl lemmata skipped.tsv; do
            cmp "$RUNNER_TEMP/lexical-stage/Latin.$name" \
                "$RUNNER_TEMP/standalone-latin-stage/Latin.$name"
          done
          "$RUNNER_TEMP/lexical-python/bin/python" test/partition-lexical-latin.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/audit-latin-partition-gaps.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/audit-latin-listall.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/audit-lexical-stems.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/partition-lexical-latin.py \
            --headers "$RUNNER_TEMP/lexical-stage/Latin.headers.jsonl" \
            --lemmata "$RUNNER_TEMP/lexical-stage/Latin.lemmata" \
            --output "$RUNNER_TEMP/lexical-partition"
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-partition-gaps.py \
            --headers "$RUNNER_TEMP/lexical-stage/Latin.headers.jsonl" \
            --nominal-baseline stemlib/Latin/stemsrc/ls.nom \
            --verbal-baseline stemlib/Latin/stemsrc/vbs.latin
          "$RUNNER_TEMP/lexical-python/bin/python" test/prepare-latin-partition-review.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/prepare-latin-partition-review.py \
            --headers "$RUNNER_TEMP/lexical-stage/Latin.headers.jsonl" \
            --lexica "$RUNNER_TEMP/lexica" \
            --nominal-baseline stemlib/Latin/stemsrc/ls.nom \
            --verbal-baseline stemlib/Latin/stemsrc/vbs.latin \
            --expected 393

      - name: Build historical header and nominal filters in isolation
        run: |
          mkdir "$RUNNER_TEMP/legacy-filters"
          for scanner in splitlems fixhesc fixgend latnom \
            combitype splitlat conj1 latvb; do
            flex -o "$RUNNER_TEMP/legacy-filters/$scanner.c" \
              "src/gkdict/$scanner.l"
            gcc -std=gnu89 -w \
              -o "$RUNNER_TEMP/legacy-filters/$scanner" \
              "$RUNNER_TEMP/legacy-filters/$scanner.c" -lfl
          done

      - name: Exercise the complete candidate header stream
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 120s "$RUNNER_TEMP/legacy-filters/splitlems" \
            < "$RUNNER_TEMP/lexical-stage/Latin.lemmata" \
            > "$RUNNER_TEMP/lexical-stage/Latin.split"
          timeout 120s "$RUNNER_TEMP/legacy-filters/fixhesc" \
            < "$RUNNER_TEMP/lexical-stage/Latin.split" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixgend" \
            > "$RUNNER_TEMP/lexical-stage/Latin.filtered"
          # vtags, which historically separated verbs from nouns, is absent.
          # Feed the unpartitioned stream only as a diagnostic; do not label
          # this output a reconstructed nominal corpus.
          timeout 120s "$RUNNER_TEMP/legacy-filters/latnom" \
            < "$RUNNER_TEMP/lexical-stage/Latin.filtered" \
            > "$RUNNER_TEMP/lexical-stage/Latin.nominal-diagnostic"
          # The other original path likewise omits the missing vtags selector.
          timeout 120s "$RUNNER_TEMP/legacy-filters/combitype" \
            < "$RUNNER_TEMP/lexical-stage/Latin.lemmata" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/splitlat" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/conj1" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latvb" \
            > "$RUNNER_TEMP/lexical-stage/Latin.verbal-diagnostic"
          "$RUNNER_TEMP/lexical-python/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'lexical-stage'
          report = json.loads((stage / 'Latin.report.json').read_text())
          rows = report['projected_rows']
          counts = {}
          for name in ('Latin.split', 'Latin.filtered'):
              path = stage / name
              with path.open('rb') as source:
                  counts[name] = sum(1 for _ in source)
              assert path.stat().st_size > 0
          assert counts['Latin.split'] >= rows
          nominal = stage / 'Latin.nominal-diagnostic'
          tags = {':le:': 0, ':no:': 0, ':aj:': 0, ':wd:': 0}
          with nominal.open('rb') as source:
              for line in source:
                  for tag in tags:
                      if line.startswith(tag.encode()):
                          tags[tag] += 1
          print(json.dumps({'projected_rows': rows, 'filter_output_lines': counts,
                            'unpartitioned_nominal_diagnostic': tags}, sort_keys=True))
          PY
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-stage/Latin.nominal-diagnostic" \
            --baseline stemlib/Latin/stemsrc/ls.nom
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-stage/Latin.verbal-diagnostic" \
            --baseline stemlib/Latin/stemsrc/vbs.latin

      - name: Exercise the experimental partition through historical filters
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          timeout 120s "$RUNNER_TEMP/legacy-filters/splitlems" \
            < "$RUNNER_TEMP/lexical-partition/nominal.lemmata" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixhesc" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixgend" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latnom" \
            > "$RUNNER_TEMP/lexical-partition/nominal.stems"
          timeout 120s "$RUNNER_TEMP/legacy-filters/combitype" \
            < "$RUNNER_TEMP/lexical-partition/verbal.lemmata" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/splitlat" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/conj1" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latvb" \
            > "$RUNNER_TEMP/lexical-partition/verbal.stems"
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-partition/nominal.stems" \
            --baseline stemlib/Latin/stemsrc/ls.nom
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-partition/verbal.stems" \
            --baseline stemlib/Latin/stemsrc/vbs.latin

      - name: Qualify source-backed first-sense Latin recovery separately
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-initial-sense.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-initial-sense.py \
            --headers "$RUNNER_TEMP/lexical-stage/Latin.headers.jsonl" \
            --lemmata "$RUNNER_TEMP/lexical-stage/Latin.lemmata" \
            --lexica "$RUNNER_TEMP/lexica" \
            --output "$RUNNER_TEMP/latin-source-recovered" \
            --expected 630
          "$RUNNER_TEMP/lexical-python/bin/python" tools/partition-lexical-latin.py \
            --headers "$RUNNER_TEMP/latin-source-recovered/Latin.headers.jsonl" \
            --lemmata "$RUNNER_TEMP/latin-source-recovered/Latin.lemmata" \
            --output "$RUNNER_TEMP/latin-source-recovered-partition"
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-partition-gaps.py \
            --headers "$RUNNER_TEMP/latin-source-recovered/Latin.headers.jsonl" \
            --nominal-baseline stemlib/Latin/stemsrc/ls.nom \
            --verbal-baseline stemlib/Latin/stemsrc/vbs.latin
          timeout 120s "$RUNNER_TEMP/legacy-filters/splitlems" \
            < "$RUNNER_TEMP/latin-source-recovered-partition/nominal.lemmata" \
            2> "$RUNNER_TEMP/latin-source-recovered/splitlems.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixhesc" \
              2> "$RUNNER_TEMP/latin-source-recovered/fixhesc.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixgend" \
              2> "$RUNNER_TEMP/latin-source-recovered/fixgend.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latnom" \
              2> "$RUNNER_TEMP/latin-source-recovered/latnom.log" \
            > "$RUNNER_TEMP/latin-source-recovered/nominal.stems"
          timeout 120s "$RUNNER_TEMP/legacy-filters/combitype" \
            < "$RUNNER_TEMP/latin-source-recovered-partition/verbal.lemmata" \
            2> "$RUNNER_TEMP/latin-source-recovered/combitype.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/splitlat" \
              2> "$RUNNER_TEMP/latin-source-recovered/splitlat.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/conj1" \
              2> "$RUNNER_TEMP/latin-source-recovered/conj1.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latvb" \
              2> "$RUNNER_TEMP/latin-source-recovered/latvb.log" \
            > "$RUNNER_TEMP/latin-source-recovered/verbal.stems"
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/latin-source-recovered/nominal.stems" \
            --baseline stemlib/Latin/stemsrc/ls.nom
          "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/latin-source-recovered/verbal.stems" \
            --baseline stemlib/Latin/stemsrc/vbs.latin
          "$RUNNER_TEMP/lexical-python/bin/python" test/transfer-lexical-record-corrections.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/transfer-lexical-record-corrections.py \
            --candidate "$RUNNER_TEMP/latin-source-recovered/nominal.stems" \
            --original stemlib/Latin/stemsrc/ls.nom \
            --corrections tools/stemlib-lexical-corrections.tsv \
            --language Latin --source-path stemsrc/ls.nom \
            --private-output "$RUNNER_TEMP/latin-source-recovered/nominal-reviewed.stems" \
            --expected 44

      - name: Stage explicit full Latin compounds as a separate source trial
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-compound-headwords.py
          "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-compound-headwords.py \
            --headers "$RUNNER_TEMP/latin-source-recovered/Latin.headers.jsonl" \
            --lemmata "$RUNNER_TEMP/latin-source-recovered/Latin.lemmata" \
            --lexica "$RUNNER_TEMP/lexica" \
            --output "$RUNNER_TEMP/latin-full-compounds" --expected 104
          "$RUNNER_TEMP/lexical-python/bin/python" tools/partition-lexical-latin.py \
            --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
            --lemmata "$RUNNER_TEMP/latin-full-compounds/Latin.lemmata" \
            --output "$RUNNER_TEMP/latin-full-compounds-partition"
          timeout 120s "$RUNNER_TEMP/legacy-filters/splitlems" \
            < "$RUNNER_TEMP/latin-full-compounds-partition/nominal.lemmata" \
            2> "$RUNNER_TEMP/latin-full-compounds/splitlems.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixhesc" \
              2> "$RUNNER_TEMP/latin-full-compounds/fixhesc.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/fixgend" \
              2> "$RUNNER_TEMP/latin-full-compounds/fixgend.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latnom" \
              2> "$RUNNER_TEMP/latin-full-compounds/latnom.log" \
            > "$RUNNER_TEMP/latin-full-compounds/nominal.stems"
          timeout 120s "$RUNNER_TEMP/legacy-filters/combitype" \
            < "$RUNNER_TEMP/latin-full-compounds-partition/verbal.lemmata" \
            2> "$RUNNER_TEMP/latin-full-compounds/combitype.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/splitlat" \
              2> "$RUNNER_TEMP/latin-full-compounds/splitlat.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/conj1" \
              2> "$RUNNER_TEMP/latin-full-compounds/conj1.log" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/latvb" \
              2> "$RUNNER_TEMP/latin-full-compounds/latvb.log" \
            > "$RUNNER_TEMP/latin-full-compounds/verbal.stems"
          for kind in nominal verbal; do
            baseline=stemlib/Latin/stemsrc/ls.nom
            if [ "$kind" = verbal ]; then baseline=stemlib/Latin/stemsrc/vbs.latin; fi
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-lexical-stems.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/$kind.stems" --baseline "$baseline"
          done
          "$RUNNER_TEMP/lexical-python/bin/python" tools/transfer-lexical-record-corrections.py \
            --candidate "$RUNNER_TEMP/latin-full-compounds/nominal.stems" \
            --original stemlib/Latin/stemsrc/ls.nom \
            --corrections tools/stemlib-lexical-corrections.tsv \
            --language Latin --source-path stemsrc/ls.nom \
            --private-output "$RUNNER_TEMP/latin-full-compounds/nominal-reviewed.stems" --expected 44

      - name: Qualify source-only regular derivative and principal-part repairs
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/lexical-python/bin/python" test/repair-latin-first-conjugation.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/repair-latin-principal-parts.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-ingo-parts.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-full-alternates.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-second-supines.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/repair-latin-jicio-parts.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-regular-parts-alternates.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-combined-fourth-parts.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-untagged-inchoative-present.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-velar-suffix.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-cited-present.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-boundary-present.py
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-vowel-present.py
          for tier in all letters-only; do
            expected=220
            if [ "$tier" = letters-only ]; then expected=50; fi
            "$RUNNER_TEMP/lexical-python/bin/python" tools/repair-latin-first-conjugation.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier.stems" \
              --tier "$tier" --expected "$expected"
            "$RUNNER_TEMP/lexical-python/bin/python" tools/repair-latin-principal-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-parts.stems" --expected 2
            "$RUNNER_TEMP/lexical-python/bin/python" tools/repair-latin-principal-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-parts.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-allomorphs.stems" \
              --proof-tier source-allomorphs --expected 20
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-ingo-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-allomorphs.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-ingo.stems" --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-full-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-ingo.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-alternates.stems" --expected 131
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-second-supines.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-alternates.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-supines.stems" --expected 4
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-full-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-supines.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-fourth-alternates.stems" \
              --tier fourth-explicit-perfect --expected 2
            "$RUNNER_TEMP/lexical-python/bin/python" tools/repair-latin-jicio-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-fourth-alternates.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-jicio.stems" --expected 18
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-regular-parts-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-jicio.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-regular-alternates.stems" --expected 18
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-combined-fourth-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-regular-alternates.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-combined-supine.stems" --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-combined-fourth-parts.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-combined-supine.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-combined-perfect.stems" \
              --tier perfect-only --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-regular-parts-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-combined-perfect.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-terminal-alternates.stems" \
              --tier terminal-delimiter --expected 3
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-regular-parts-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-terminal-alternates.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-present-alternates.stems" \
              --tier present-only --expected 4
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-regular-parts-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-present-alternates.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-inchoative-present.stems" \
              --tier inchoative-present --expected 4
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-regular-parts-alternates.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-inchoative-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-velar-present.stems" \
              --tier velar-present --expected 3
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-untagged-inchoative-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-velar-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-untagged-inchoative.stems" \
              --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-velar-suffix.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-untagged-inchoative.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-velar-suffix.stems" \
              --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-cited-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-velar-suffix.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-cited-present.stems" \
              --expected 11
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-cited-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-cited-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-cited-future-imperative.stems" \
              --evidence future-imperative --expected 4
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-boundary-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-cited-future-imperative.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-boundary-present.stems" \
              --expected 11
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-vowel-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-boundary-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-vowel-present.stems" \
              --expected 4
          done

      - name: Rebuild the private remaining-present inventory
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/lexical-python/bin/python" test/audit-latin-remaining-presents.py
          for tier in all letters-only; do
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-remaining-presents.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-vowel-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/remaining-present-$tier.jsonl" \
              --expected 15 \
              > "$RUNNER_TEMP/latin-full-compounds/remaining-present-$tier.report.json"
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-remaining-presents.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-vowel-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/coordinated-present-$tier.jsonl" \
              --grammar coordinated-supines --expected 16 --expected-articles 16 \
              > "$RUNNER_TEMP/latin-full-compounds/coordinated-present-$tier.report.json"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'latin-full-compounds'
          reports = {tier: json.loads((stage / ('remaining-present-' + tier + '.report.json')).read_text())
                     for tier in ('all', 'letters-only')}
          left, right = reports.values()
          if (left['counts'] != right['counts'] or
                  left['private_inventory_sha256'] != right['private_inventory_sha256']):
              raise ValueError('quantity treatments produce different remaining-present inventories')
          broader = {tier: json.loads((stage / ('coordinated-present-' + tier + '.report.json')).read_text())
                     for tier in ('all', 'letters-only')}
          broad_left, broad_right = broader.values()
          if (broad_left['counts'] != broad_right['counts'] or
                  broad_left['private_inventory_sha256'] != broad_right['private_inventory_sha256']):
              raise ValueError('coordinated diagnostic inventories differ between quantity treatments')
          for tier in reports:
              strict_rows = {row for row in (stage / ('remaining-present-' + tier + '.jsonl')).read_bytes().splitlines()}
              broad_rows = {row for row in (stage / ('coordinated-present-' + tier + '.jsonl')).read_bytes().splitlines()}
              if not strict_rows < broad_rows or len(broad_rows - strict_rows) != 1:
                  raise ValueError('coordinated syntax does not explain exactly one additional dossier')
          print(json.dumps({'remaining_present_audit': reports,
                            'coordinated_supine_diagnostic': broader,
                            'legacy_inventory_comparison': {
                                'recorded_variants': 16, 'recorded_articles': 16,
                                'strict_selector_variants': left['counts']['variants'],
                                'strict_selector_articles': left['counts']['articles'],
                                'identity_with_legacy_inventory': 'unresolved'}}, sort_keys=True))
          PY

      - name: Stage present alternates with independent reverse references
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-backlinked-present.py
          for tier in all letters-only; do
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-backlinked-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-vowel-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-backlinked-present.stems" \
              --expected 9
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-remaining-presents.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-backlinked-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/post-backlinked-$tier.jsonl" \
              --expected 6 --expected-articles 6
          done

      - name: Stage the quoted present with coordinated supines
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-coordinated-present.py
          for tier in all letters-only; do
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-coordinated-present.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-backlinked-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-coordinated-present.stems" \
              --private-witness "$RUNNER_TEMP/latin-full-compounds/coordinated-present-$tier.witness.jsonl" \
              --expected 1
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-remaining-presents.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-coordinated-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/post-coordinated-$tier.jsonl" \
              --grammar coordinated-supines --expected 6 --expected-articles 6
            cmp "$RUNNER_TEMP/latin-full-compounds/post-backlinked-$tier.jsonl" \
                "$RUNNER_TEMP/latin-full-compounds/post-coordinated-$tier.jsonl"
          done
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'latin-full-compounds'
          witnesses = []
          for tier in ('all', 'letters-only'):
              rows = [json.loads(row) for row in (stage / ('coordinated-present-' + tier + '.witness.jsonl')).read_text().splitlines()]
              if len(rows) != 1:
                  raise ValueError('expected one source quotation witness')
              witnesses.append([{key: value for key, value in row.items() if key != 'candidate_sha256'} for row in rows])
          if witnesses[0] != witnesses[1]:
              raise ValueError('quantity treatments produce different source quotation witnesses')
          print(json.dumps({'coordinated_present_source_control': {'witnesses': 1, 'quantity_witnesses_equal': True,
                            'remaining_inventories_unchanged': True}}, sort_keys=True))
          PY

      - name: Stage bounded whole-word present spellings
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          "$RUNNER_TEMP/lexical-python/bin/python" test/recover-latin-bounded-present-spellings.py
          for tier in all letters-only; do
            "$RUNNER_TEMP/lexical-python/bin/python" tools/recover-latin-bounded-present-spellings.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-coordinated-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-bounded-present.stems" \
              --private-witness "$RUNNER_TEMP/latin-full-compounds/bounded-present-$tier.witness.jsonl" \
              --expected 5
            "$RUNNER_TEMP/lexical-python/bin/python" tools/audit-latin-remaining-presents.py \
              --candidate "$RUNNER_TEMP/latin-full-compounds/verbal-$tier-bounded-present.stems" \
              --headers "$RUNNER_TEMP/latin-full-compounds/Latin.headers.jsonl" \
              --lexica "$RUNNER_TEMP/lexica" \
              --private-output "$RUNNER_TEMP/latin-full-compounds/post-bounded-$tier.jsonl" \
              --grammar coordinated-supines --expected 1 --expected-articles 1
          done
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'latin-full-compounds'
          witnesses, remaining = [], []
          for tier in ('all', 'letters-only'):
              rows = [json.loads(row) for row in (stage / ('bounded-present-' + tier + '.witness.jsonl')).read_text().splitlines()]
              if len(rows) != 5 or len({row['rule'] for row in rows}) != 5 or sum(len(row['forms']) for row in rows) != 65:
                  raise ValueError('expected five distinct spelling-rule families and sixty-five cells')
              witnesses.append([{key: value for key, value in row.items() if key != 'candidate_sha256'} for row in rows])
              previous = set((stage / ('post-coordinated-' + tier + '.jsonl')).read_bytes().splitlines())
              current = set((stage / ('post-bounded-' + tier + '.jsonl')).read_bytes().splitlines())
              if not current < previous or len(previous - current) != 5:
                  raise ValueError('bounded trial does not resolve exactly five previous dossiers')
              withheld = json.loads(next(iter(current)))
              if hashlib.sha256(withheld['id'].encode()).hexdigest() != '8d311aea39f63d40f1e41a379b1c58447f35351d8e0c8a9a6a20421d3858be3a':
                  raise ValueError('remaining article differs from the reviewed contextual abbreviation')
              remaining.append((stage / ('post-bounded-' + tier + '.jsonl')).read_bytes())
          if witnesses[0] != witnesses[1] or remaining[0] != remaining[1]:
              raise ValueError('quantity treatments produce different families or remaining dossiers')
          print(json.dumps({'bounded_present_source_control': {'source_families': 5, 'expected_cells': 65,
                            'quantity_witnesses_equal': True, 'remaining_articles': 1,
                            'private_remaining_sha256': hashlib.sha256(remaining[0]).hexdigest()}}, sort_keys=True))
          PY

      - name: Compare final readings globally with controlled nominal witnesses
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          python3 test/qualify-latin-present-stages.py
          python3 test/audit-latin-global-readings.py
          cmake -S . -B "$RUNNER_TEMP/present-native" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DMORPHEUS_BUILD_CRUNCHER=OFF -DMORPHEUS_BUILD_STEMLIB_TOOLS=ON
          cmake --build "$RUNNER_TEMP/present-native" --parallel 2 \
            --target morpheus morpheus_stemlib_production_latin
          python3 test/qualify-latin-present-stages-native.py "$RUNNER_TEMP/present-native"
          python3 - <<'PY'
          import os
          from pathlib import Path
          import urllib.request

          url = 'https://downloads.sourceforge.net/project/wwwords/Whitaker/listall.zip'
          with urllib.request.urlopen(url, timeout=60) as response:
              data = response.read(8_000_001)
          (Path(os.environ['RUNNER_TEMP']) / 'present-listall.zip').write_bytes(data)
          PY
          python3 tools/prepare-latin-listall.py \
            --archive "$RUNNER_TEMP/present-listall.zip" \
            --output "$RUNNER_TEMP/present-listall"
          python3 tools/qualify-latin-present-stages.py \
            --forms "$RUNNER_TEMP/present-listall/LISTALL.distinct-literal.txt" \
            --library "$RUNNER_TEMP/present-native/libmorpheus.so" \
            --baseline "$RUNNER_TEMP/present-native/stemlib-production/latin" \
            --stage "$RUNNER_TEMP/latin-full-compounds" \
            --tools "$RUNNER_TEMP/present-native" \
            --private-output "$RUNNER_TEMP/present-qualification" \
            --expected-forms 1033579 --include-bounded --global-readings-only
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          temp = Path(os.environ['RUNNER_TEMP'])
          stage = temp / 'latin-full-compounds'
          reference = json.loads(Path('tools/latin-final-present-reference.json').read_text())
          report = json.loads((temp / 'present-qualification/report.json').read_text())
          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()
          source = temp / 'lexica/CTS_XML_TEI/perseus/pdllex/lat/ls/lat.ls.perseus-eng1.xml'
          if (digest(source) != reference['source_sha256'] or
                  digest(stage / 'Latin.headers.jsonl') != reference['headers_sha256']):
              raise ValueError('selected source or recovered headers differ from qualified reference')
          for tier in ('all', 'letters-only'):
              if digest(stage / ('verbal-' + tier + '-bounded-present.stems')) != reference['candidate_sha256'][tier]:
                  raise ValueError('final candidate differs from qualified reference')
          if report['indexes']['bounded-present'] != reference['indexes_sha256']:
              raise ValueError('final runtime indexes differ from qualified reference')
          control = report['global_comparisons']['final-global-control']
          delta = report['global_comparisons']['baseline-to-final-global']
          if (control['input_sha256'] != reference['listall_sha256'] or
                  delta['input_sha256'] != reference['listall_sha256'] or
                  control['counts']['recognized_curated__recognized_rebuilt'] != reference['final_recognized_forms'] or
                  control['analysis_rows']['curated'] != reference['final_analysis_rows'] or
                  control['analysis_rows']['rebuilt'] != reference['final_analysis_rows']):
              raise ValueError('full final-root recognition or reading totals differ from reference')
          baseline_recognized = sum(delta['counts'].get(key, 0) for key in
              ('recognized_curated__recognized_rebuilt', 'recognized_curated__absent_rebuilt'))
          final_recognized = sum(delta['counts'].get(key, 0) for key in
              ('recognized_curated__recognized_rebuilt', 'absent_curated__recognized_rebuilt'))
          if (baseline_recognized != reference['baseline_recognized_forms'] or
                  final_recognized != reference['final_recognized_forms'] or
                  delta['analysis_rows'] != {'curated': reference['baseline_analysis_rows'], 'rebuilt': reference['final_analysis_rows']}):
              raise ValueError('global comparison totals differ from qualified reference')
          print(json.dumps({'global_reading_reference_control': {'reference_revision': reference['code_revision'],
                            'candidate_and_indexes_identical': True, 'recognition_and_reading_totals_identical': True,
                            'earlier_count_passes': 'qualified on reference revision; not repeated in global-only mode'}}, sort_keys=True))
          PY

  greek-header-filters:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Install historical lexer dependency
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq flex libfl-dev

      - name: Fetch pinned LSJ TEI chunks
        run: |
          git clone --filter=blob:none --no-checkout \
            https://github.com/PerseusDL/lexica.git "$RUNNER_TEMP/lexica"
          git -C "$RUNNER_TEMP/lexica" sparse-checkout set \
            CTS_XML_TEI/perseus/pdllex/grc/lsj
          git -C "$RUNNER_TEMP/lexica" checkout \
            56061ca127f4a2844980baffc5f2b6d1332897b3

      - name: Stage Greek candidate outside the source tree
        run: |
          python3 -m venv "$RUNNER_TEMP/lexical-python"
          "$RUNNER_TEMP/lexical-python/bin/pip" install lxml==6.1.1
          "$RUNNER_TEMP/lexical-python/bin/python" \
            test/reconstruct-lexical-exports.py
          "$RUNNER_TEMP/lexical-python/bin/python" \
            tools/reconstruct-lexical-exports.py \
            --language Greek \
            --lexica "$RUNNER_TEMP/lexica" \
            --output "$RUNNER_TEMP/lexical-stage"

      - name: Exercise Greek quantity and header split filters
        shell: bash
        run: |
          set -euo pipefail
          mkdir "$RUNNER_TEMP/legacy-filters"
          for scanner in setquant splitlems; do
            flex -o "$RUNNER_TEMP/legacy-filters/$scanner.c" \
              "src/gkdict/$scanner.l"
            gcc -std=gnu89 -w -Isrc/includes \
              -o "$RUNNER_TEMP/legacy-filters/$scanner" \
              "$RUNNER_TEMP/legacy-filters/$scanner.c" -lfl
          done
          ulimit -c 0
          sed 's/-//' "$RUNNER_TEMP/lexical-stage/Greek.lemmata" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/setquant" \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/splitlems" \
            > "$RUNNER_TEMP/lexical-stage/Greek.split"
          "$RUNNER_TEMP/lexical-python/bin/python" tools/split-greek-lexical-headers.py \
            --input "$RUNNER_TEMP/lexical-stage/Greek.lemmata" \
            --output "$RUNNER_TEMP/lexical-stage/Greek.portable.split"
          cmp -s "$RUNNER_TEMP/lexical-stage/Greek.split" \
            "$RUNNER_TEMP/lexical-stage/Greek.portable.split"
          "$RUNNER_TEMP/lexical-python/bin/python" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'lexical-stage'
          report = json.loads((stage / 'Greek.report.json').read_text())
          split = stage / 'Greek.split'
          with split.open('rb') as source:
              rows = sum(1 for _ in source)
          assert rows >= report['projected_rows']
          print(json.dumps({'projected_rows': report['projected_rows'],
                            'split_rows': rows,
                            'split_sha256': hashlib.sha256(split.read_bytes()).hexdigest()},
                           sort_keys=True))
          PY

      - name: Build legacy Greek dictionary filters against current libraries
        run: |
          cmake -S . -B "$RUNNER_TEMP/legacy-build" -G Ninja \
            -DBUILD_TESTING=OFF -DMORPHEUS_BUILD_CRUNCHER=OFF
          cmake --build "$RUNNER_TEMP/legacy-build" --target \
            morpheus_gkends morpheus_morphlib morpheus_greeklib
          for program in newlems newlems2; do
            gcc -std=gnu89 -w -Isrc/includes \
              -o "$RUNNER_TEMP/legacy-filters/$program" \
              "src/gkdict/$program.c" \
              "$RUNNER_TEMP/legacy-build/libmorpheus_gkends.a" \
              "$RUNNER_TEMP/legacy-build/libmorpheus_morphlib.a" \
              "$RUNNER_TEMP/legacy-build/libmorpheus_greeklib.a" -lm
          done

      - name: Audit Greek importer outputs against curated witnesses
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          cd stemlib/Greek
          export MORPHLIB="$PWD/.."
          test -s "$MORPHLIB/Greek/stemsrc/lemlist"
          timeout 120s "$RUNNER_TEMP/legacy-filters/newlems" \
            < "$RUNNER_TEMP/lexical-stage/Greek.split" \
            > "$RUNNER_TEMP/lexical-stage/Greek.checked"
          "$RUNNER_TEMP/lexical-python/bin/python" - <<'PY'
          import json
          import os
          from collections import Counter
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'lexical-stage'
          with (stage / 'Greek.checked').open('rb') as source:
              counts = Counter('0' if line.startswith(b'0 ') else
                               '1' if line.startswith(b'1 ') else 'other'
                               for line in source)
          assert counts['0'] > 0 and counts['1'] > 0 and counts['other'] == 0
          print(json.dumps({'dictionary_probe_prefixes': dict(sorted(counts.items()))},
                           sort_keys=True))
          PY
          grep -Fv '1 ' "$RUNNER_TEMP/lexical-stage/Greek.checked" \
            | grep -Fv ': ' \
            | timeout 120s "$RUNNER_TEMP/legacy-filters/newlems2" \
            > "$RUNNER_TEMP/lexical-stage/Greek.morph"
          grep -Fv '0:' "$RUNNER_TEMP/lexical-stage/Greek.morph" \
            > "$RUNNER_TEMP/lexical-stage/Greek.nominal-diagnostic"
          cp /tmp/lsj.vbs "$RUNNER_TEMP/lexical-stage/Greek.verbal-diagnostic"
          "$RUNNER_TEMP/lexical-python/bin/python" ../../tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-stage/Greek.nominal-diagnostic" \
            --baseline stemsrc/lsj.nom \
            --greek-spelling-diagnostic
          "$RUNNER_TEMP/lexical-python/bin/python" ../../tools/audit-lexical-stems.py \
            --candidate "$RUNNER_TEMP/lexical-stage/Greek.verbal-diagnostic" \
            --baseline stemsrc/lsj.vbs \
            --greek-spelling-diagnostic

      - name: Probe Greek first-token quantity without changing the candidate
        shell: bash
        run: |
          set -euo pipefail
          ulimit -c 0
          "$RUNNER_TEMP/lexical-python/bin/python" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          stage = Path(os.environ['RUNNER_TEMP']) / 'lexical-stage'
          changed = 0
          with (stage / 'Greek.split').open('rb') as source, \
               (stage / 'Greek.no-first-quantity.split').open('wb') as target:
              for raw in source:
                  match = re.match(rb'\S+', raw)
                  if not match:
                      target.write(raw)
                      continue
                  head = match.group()
                  bare = head.translate(None, b'^_')
                  changed += bare != head
                  target.write(bare + raw[len(head):])
          assert changed > 0
          print(json.dumps({'split_rows_with_first-token_quantity_removed': changed}))
          PY
          cd stemlib/Greek
          export MORPHLIB="$PWD/.."
