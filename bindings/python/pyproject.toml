# SPDX-License-Identifier: AGPL-3.0-or-later

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "libmorpheus"
version = "0.1.1"
description = "Python binding for Ancient Greek and Latin morphology with libmorpheus"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
authors = [
  { name = "Défense des humanités" },
]
maintainers = [
  { name = "Antoine Boquet" },
]
keywords = [
  "ancient-greek",
  "classics",
  "digital-humanities",
  "latin",
  "morphology",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Education",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed",
]
dependencies = []

[project.urls]
Documentation = "https://github.com/defense-humanites/libmorpheus/tree/main/bindings/python"
Issues = "https://github.com/defense-humanites/libmorpheus/issues"
Repository = "https://github.com/defense-humanites/libmorpheus"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
libmorpheus = ["py.typed"]
